<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Add an opportunity — Launchpad</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/><style>
.admin-main{max-width:800px;margin:60px auto;padding:0 24px 80px}.admin-main h1{font:800 42px Manrope;letter-spacing:-2px;margin:16px 0}.admin-main>p{color:#747970;line-height:1.7}.admin-form{background:#fff;padding:28px;margin-top:26px;border:1px solid #e4e6df;display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin-form label{font-size:11px;font-weight:700;color:#4c5249;display:grid;gap:7px}.admin-form input,.admin-form select,.admin-form textarea{width:100%;padding:12px;border:1px solid #e2e5dc;background:#fcfcfa;font:12px 'DM Sans',sans-serif;color:#20231f}.admin-form textarea{min-height:85px;resize:vertical}.admin-form .full{grid-column:1/-1}.admin-form .button{border:0;cursor:pointer;justify-self:start}.admin-status{font-size:12px;line-height:1.6}.admin-status.error{color:#ae382d}.admin-status.success{color:#426b18}.admin-help{font-size:10px;color:#81877e}.admin-header{height:76px;padding:0 7.3%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9ebe5}.back-link{font-size:12px;font-weight:700}@media(max-width:600px){.admin-form{grid-template-columns:1fr;padding:20px}.admin-form .full{grid-column:auto}.admin-main h1{font-size:34px}.admin-main{margin-top:40px}}
</style><script src="admin.js" defer></script></head>
<body><header class="admin-header"><a class="brand" href="/"><span class="brand-mark">↗</span> launchpad<span class="brand-dot">.</span></a><a class="back-link" href="/">← View opportunities</a></header><main class="admin-main"><div class="eyebrow"><span class="eyebrow-dot"></span> OPPORTUNITY ADMIN</div><h1>Add to the board.</h1><p>Save a listing to the database and it will appear on the main page right away. Include accurate details and the provider’s official link.</p>
<form id="admin-form" class="admin-form"><label class="full">Admin password *<input id="admin-password" type="password" autocomplete="current-password" required/><span class="admin-help">Set this with the LAUNCHPAD_ADMIN_PASSWORD environment variable before starting the server.</span></label>
<label>Opportunity title *<input name="title" required maxlength="120"/></label><label>Provider / organization *<input name="provider" required maxlength="120"/></label>
<label>Category *<select name="category" required><option value="funding">Funding & grants</option><option value="startup">Build a startup</option><option value="innovation">Innovation program</option><option value="student">Student scheme</option></select></label><label>Study level *<select name="level"><option value="any">Any student</option><option value="undergraduate">Undergraduate</option><option value="postgraduate">Postgraduate</option></select></label>
<label>Location *<select name="location"><option value="india">India</option><option value="global">Global / online</option></select></label><label>Funding / support amount *<input name="amount" required placeholder="e.g. Up to ₹50,000"/></label>
<label>Deadline *<input name="deadline" required placeholder="e.g. 30 November 2026"/></label><label>Short tag<input name="tag" placeholder="e.g. Prototype friendly"/></label>
<label class="full">Short description *<textarea name="description" required maxlength="240"></textarea></label><label class="full">Eligibility *<textarea name="eligibility" required></textarea></label><label class="full">More details *<textarea name="details" required></textarea></label><label class="full">Official application / information URL<input name="url" type="url" placeholder="https://..."/></label>
<div class="full"><button class="button button-dark" type="submit">Save opportunity <span>↗</span></button></div><div id="admin-status" class="admin-status full" role="status" aria-live="polite"></div></form></main></body></html>
